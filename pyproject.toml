[build-system]
requires = [
  "scikit-build-core>=1.0,<2",
  "cython-cmake>=0.2,<1",
  "Cython>=3,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]
build-backend = "scikit_build_core.build"

[project]
name = "electromagnetics-fem"
version = "1.1.2"
description = "FEM electromagnetic solvers and interactive native applications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4",
  "h5py>=3.15,<4", "scikit-fem>=12,<13", "gmsh>=4.13,<5", "meshio>=5.3,<6",
  "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/SolverNotConverging/Electromagnetics-FEM"
Releases = "https://github.com/SolverNotConverging/Electromagnetics-FEM/releases"

[project.optional-dependencies]
test = ["pytest>=8,<10", "docutils"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "docutils",
  "delocate>=0.13,<1; sys_platform == 'darwin'",
  "pandas",
]

[project.scripts]
fem = "fem.__main__:main"
transmission-line-calculator = "fem._apps:calculator"
transmission-line-calculator-cli = "fem._apps:calculator_cli"
fem-periodic-mode-viewer = "fem._apps:periodic_viewer"
fem-periodic-mode-inspect = "fem._apps:periodic_inspector"
fem-waveguide-scattering-viewer = "fem._apps:scattering_viewer"
fem-waveguide-scattering-viewer-inspect = "fem._apps:scattering_inspector"

[tool.uv]
package = false
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "setup_cython.py" },
  { file = "**/src/*.py" },
  { file = "**/src/*.pyx" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["fem", "fem_common", "fem_adaptivity", "fem_electrostatics", "fem_periodic_modes", "fem_waveguide_modes", "fem_waveguide_scattering", "periodic_eigensolver"]
wheel.exclude = ["**/*.pyx", "**/__pycache__/**", "**/docs/**", "**/examples/**", "**/scripts/**", "**/outputs/**"]
sdist.exclude = [".idea", "outputs", "examples", "**/__pycache__", "**/build", "**/outputs"]

# Keep Windows caches separate from the former MinGW build directory.
[[tool.scikit-build.overrides]]
if.platform-system = "^win32$"
build-dir = "build/msvc/{wheel_tag}"
cmake.args = ["-DCMAKE_C_COMPILER=cl", "-DCMAKE_CXX_COMPILER=cl"]
