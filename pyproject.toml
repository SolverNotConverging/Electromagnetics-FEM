[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "electromagnetics-fem"
dynamic = ["version"]
description = "FEM electromagnetic solvers with interactive PyVista/Qt viewers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4",
  "h5py>=3.15,<4", "scikit-fem>=12,<13", "gmsh>=4.13,<5", "meshio>=5.3,<6",
  "tqdm>=4.66,<5", "pyvista>=0.44", "pyvistaqt>=0.11", "PySide6>=6.6,<7",
]

[project.urls]
Repository = "https://github.com/SolverNotConverging/Electromagnetics-FEM"

[project.optional-dependencies]
# GPU factorization with NVIDIA cuDSS (pick the extra matching your CUDA runtime).
cuda12 = ["cupy-cuda12x>=13.6,<15", "nvidia-cudss-cu12"]
cuda13 = ["cupy-cuda13x>=14,<15", "nvidia-cudss-cu13"]

[project.scripts]
fem = "fem.__main__:main"

[dependency-groups]
test = ["pytest>=8,<10", "docutils"]
lint = ["ruff>=0.14,<1"]
docs = ["sphinx>=8", "myst-parser>=4"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "pandas"]

[tool.hatch.version]
path = "src/fem/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
markers = ["gmsh: test requiring Gmsh", "slow: numerical convergence or performance test"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
