name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10' docutils 'ruff>=0.14,<1'
      - run: python -m ruff check .
      - run: python scripts/sync_metadata.py --check
      - run: python scripts/generate_api_reference.py --check
      - run: python scripts/check_documentation.py
      - run: python -m pytest -q

  solver-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install build
      - run: python -m build --wheel --config-setting=cmake.define.FEM_BUILD_NATIVE_APPS=OFF
      - run: python -m pip install dist/*.whl
      - name: Verify installed package outside checkout
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/scripts/verify_solver_install.py"
